network:
  version: 2
  renderer: NetworkManager

  wifis:
    wlp2s0:
      dhcp4: false
      dhcp6: false

      addresses:
        - 192.168.1.100/24

      routes:
        - to: default
          via: 192.168.1.1

      nameservers:
        addresses:
          - 8.8.8.8
          - 1.1.1.1

      access-points:
        "......":
          password: "....."
